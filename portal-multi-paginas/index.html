<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {

            padding: 0;
            box-sizing: content-box;
            list-style: none;

        header {

            align-items: center;
            justify-content: space-between;
            background-color: whitesmoke;
        }
        header > span, header > nav {
            margin: 15px;
        }
        #links {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        li {
            padding: 5px;
        }
    </style>
</head>

            <span style="font-size: 30px;"">C</span>
            <span style="font-size: 20px; align-items: center;">apitólio</span>
        </span>
        

        <nav>
            <ul id="links">
                <li><a href="#inicio">Inicio</a></li>
                <li><a href="#contato">Contato</a></li>
                <li><a href="#sobre">Sobre</a></li>
                <li><a href="#saibaMais">Saiba Mais</a></li>
            </ul>
        </nav>
    </header>
    <hr>
</body>
</html>
